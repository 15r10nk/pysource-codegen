name: Weekly Cog Update

on:
  schedule:
  - cron: 0 8 * * 5      # Every Friday at 08:00 UTC
  workflow_dispatch:

jobs:
  weekly-update:
    permissions:
      contents: write
      pull-requests: write

    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Set up uv
      uses: astral-sh/setup-uv@v5

    - name: Run cog update
      run: |
        git ls-files -z -- '*.py' '*.md' | xargs -0 -r uv run --group cog cog -r
        uvx gha-update
        uvx pre-commit run -a

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        token: ${{github.token}}
        branch-token: ${{secrets.PAT_WEEKLY_UPDATE}}
        commit-message: 'chore: weekly cog update'
        title: 'chore: weekly update'
        body: Automated weekly update via scheduled workflow.
        branch: chore/weekly-update
        delete-branch: true
        reviewers: 15r10nk
