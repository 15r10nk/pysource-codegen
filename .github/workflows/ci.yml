name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # ubuntu-24.04 is the newest Ubuntu runner where actions/setup-python can
  # install Python 3.8 and 3.9. We also require virtualenv<21 on these
  # interpreters because the last compatible Hatch releases skip the checks
  # and exit successfully when virtualenv 21 is installed.
  # https://github.com/pypa/hatch/issues/2193
  mypy:
    strategy:
      matrix:
        include:
        - os: ubuntu-24.04
          python-version: '3.8'
        - os: ubuntu-24.04
          python-version: '3.9'
        - os: ubuntu-latest
          python-version: '3.10'
        - os: ubuntu-latest
          python-version: '3.11'
        - os: ubuntu-latest
          python-version: '3.12'
        - os: ubuntu-latest
          python-version: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{matrix.python-version}}
        architecture: x64
        allow-prereleases: true
    - run: pip install hatch "virtualenv<21; python_version < '3.10'"
    - run: hatch run +py=${{matrix.python-version}} types:check

  test:
    strategy:
      matrix:
        include:
        - os: ubuntu-24.04
          python-version: '3.8'
        - os: ubuntu-24.04
          python-version: '3.9'
        - os: ubuntu-latest
          python-version: '3.10'
        - os: ubuntu-latest
          python-version: '3.11'
        - os: ubuntu-latest
          python-version: '3.12'
        - os: ubuntu-latest
          python-version: '3.13'
        - os: ubuntu-latest
          python-version: '3.14'
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{matrix.python-version}}
        architecture: x64
        allow-prereleases: true
    - run: pip install hatch "virtualenv<21; python_version < '3.10'"
    - run: hatch test -py ${{matrix.python-version}}


  publish:
    name: Publish new release
    runs-on: ubuntu-latest
    needs: [test, mypy]
    environment: pypi
    permissions:
      # IMPORTANT: this permission is mandatory for Trusted Publishing
      id-token: write
      # this permission is mandatory to create github releases
      contents: write

    steps:
    - name: Checkout main
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        python-version: '3.12'

    - name: Check if the commit has a vx.y.z tag
      id: check-version
      run: |
        if git tag --list --points-at ${{ github.sha }} | grep -q -E '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "is new version"
          echo "should_continue=true" >> "$GITHUB_OUTPUT"
        else
          echo "is not a new version"
          echo "should_continue=false" >> "$GITHUB_OUTPUT"
        fi

    - name: build package
      run: uvx hatch build

    - name: Publish package distributions to PyPI
      if: ${{ steps.check-version.outputs.should_continue == 'true' }}
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

    - name: create github release
      if: ${{ steps.check-version.outputs.should_continue == 'true' }}
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: uvx scriv github-release
